name: Build and publish SrvSurvey-XP release

run-name: SrvSurvey-XP from ${{ inputs.source_ref || github.ref_name }} (${{ inputs.release_channel || 'validation' }})

on:
  pull_request:
    branches:
      - SrvSurvey-Avalonia
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional compatibility check; must match the selected workflow branch, tag, or commit
        required: false
        type: string
        default: ""
      release_channel:
        description: Stable requires a base project Version; development requires -rc.N or -rc.N.N and creates a pre-release
        required: true
        type: choice
        options:
          - development
          - stable
        default: development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RELEASE_REPOSITORY: "Fenris159/SrvSurvey"

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.metadata.outputs.is_release }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      file_version: ${{ steps.metadata.outputs.file_version }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      release_index_schema: ${{ steps.metadata.outputs.release_index_schema }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}

    steps:
      - name: Validate manual release source
        shell: bash
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$REQUESTED_SOURCE_REF" \
              && "$REQUESTED_SOURCE_REF" != "$WORKFLOW_REF_NAME" \
              && "$REQUESTED_SOURCE_REF" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Choose the source using Run workflow's branch/tag selector or gh workflow run --ref. source_ref must match that selection."
            exit 2
          fi

      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve and validate version
        id: metadata
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          $project = [xml](Get-Content src/SrvSurvey.Desktop/SrvSurvey.Desktop.csproj)
          $projectVersionText = ([string]$project.Project.PropertyGroup.Version).Trim()
          $fileVersionText = ([string]$project.Project.PropertyGroup.FileVersion).Trim()
          if ($projectVersionText -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-rc\.[1-9]\d*(\.(0|[1-9]\d*))?)?$') {
            throw "Project Version '$projectVersionText' is not a supported XP release version."
          }

          $projectCoreVersion = $projectVersionText.Split('-', 2)[0]
          $coreVersion = $null
          $fileVersionValue = $null
          if (-not [Version]::TryParse($projectCoreVersion, [ref]$coreVersion) -or
              -not [Version]::TryParse($fileVersionText, [ref]$fileVersionValue) -or
              $coreVersion -ne $fileVersionValue) {
            throw "Project Version '$projectVersionText' and FileVersion '$fileVersionText' do not share the same numeric version."
          }

          $isRelease = $env:GITHUB_EVENT_NAME -eq "workflow_dispatch"
          $channel = if ($isRelease) { $env:RELEASE_CHANNEL } else { "validation" }
          if ($isRelease -and $channel -notin @("stable", "development")) {
            throw "Release channel must be stable or development."
          }

          $isPrerelease = $projectVersionText -match '-rc\.[1-9]\d*(\.(0|[1-9]\d*))?$'
          if ($isRelease -and $channel -eq "development" -and -not $isPrerelease) {
            throw "Development releases require the project Version to end in -rc.N or -rc.N.N."
          }

          if ($isRelease -and $channel -eq "stable" -and $isPrerelease) {
            throw "Stable releases require the project Version without a release-candidate suffix."
          }

          $packageVersion = $projectVersionText
          $fileVersion = $fileVersionValue.ToString()
          $sourceSha = (git rev-parse HEAD).Trim()
          $releaseContract = ./scripts/Resolve-CrossPlatformReleaseContract.ps1 `
            -Version $packageVersion | ConvertFrom-Json
          $releaseTag = $releaseContract.releaseTag
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_index_schema=$($releaseContract.indexSchemaVersion)" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT

  build-test-publish:
    name: ${{ matrix.name }}
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            archive: zip
          - name: Linux x64
            os: ubuntu-24.04
            rid: linux-x64
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Changed-code validation needs the PR merge base; packaging needs only HEAD.
          fetch-depth: ${{ github.event_name == 'pull_request' && matrix.rid == 'linux-x64' && '0' || '1' }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet dependencies
        # Windows measured slower with the expanded package cache; keep its parallel restore.
        if: matrix.rid == 'linux-x64'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.Config', '**/NuGet.config', 'global.json', '**/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore SrvSurvey.slnx

      - name: Test release and SteamOS helper scripts
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: python3 -m unittest discover -s tests/scripts -v

      - name: Set up Linux release dependencies
        if: matrix.rid == 'linux-x64'
        uses: ./.github/actions/setup-linux-release
        with:
          profile: build

      - name: Verify C# formatting
        run: dotnet csharpier check .

      - name: Verify changed code against SonarCloud rules
        if: matrix.rid == 'linux-x64' && github.event_name == 'pull_request'
        shell: pwsh
        run: ./tools/Test-ChangedCodeQuality.ps1 -BaseRef "origin/${{ github.base_ref }}" -FullTestSuite -ResultsDirectory "artifacts/TestResults/quality"

      - name: Verify localization catalogs
        shell: pwsh
        run: ./tools/Generate-AvaloniaLocalization.ps1 -Verify

      - name: Build
        run: dotnet build SrvSurvey.slnx --configuration Release --no-restore

      - name: Build and test Windows OpenXR layer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          cmake -S src/SrvSurvey.OpenXrLayer -B artifacts/openxr-build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/openxr-build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/openxr-build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install artifacts/openxr-build --config Release --prefix artifacts/openxr-layer

      - name: Test OpenXR frame protocol on Linux
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          cmake -S src/SrvSurvey.OpenXrLayer -B artifacts/openxr-build -DCMAKE_BUILD_TYPE=Release
          cmake --build artifacts/openxr-build
          ctest --test-dir artifacts/openxr-build --output-on-failure

      - name: Test
        # Linux PR validation already ran the full solution with retained TRX and coverage.
        if: matrix.rid != 'linux-x64' || github.event_name != 'pull_request'
        timeout-minutes: 10
        run: >-
          dotnet test SrvSurvey.slnx
          --configuration Release --no-build --no-restore
          --logger trx
          --blame-hang-timeout 2m
          --blame-hang-dump-type mini

      - name: Install journey report browser runtime
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: ./tests/SrvSurvey.Desktop.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium

      - name: Test portable journey reports offline in Chromium
        if: matrix.rid == 'linux-x64'
        env:
          SRVSURVEY_RUN_BROWSER_TESTS: '1'
        run: >-
          dotnet test tests/SrvSurvey.Desktop.Tests --configuration Release --no-build --no-restore
          --filter Category=Browser --logger trx --results-directory artifacts/TestResults/browser

      - name: Enforce journal upload scenario matrix
        shell: pwsh
        run: ./tools/Test-JournalUploadScenarios.ps1 -ResultsDirectory .

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.rid }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*Sequence*.xml
            **/TestResults/**/*.dmp
            **/TestResults/**/coverage.opencover.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish self-contained desktop application
        shell: pwsh
        env:
          INARA_APPLICATION_API_KEY: ${{ secrets.INARA_APPLICATION_API_KEY }}
          VOXSTELLAR_SHARED_KEY: ${{ secrets.VOXSTELLAR_SHARED_KEY }}
          GoogleDriveClientId: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GoogleDriveClientSecret: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
        run: |
          dotnet publish src/SrvSurvey.Desktop/SrvSurvey.Desktop.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output "artifacts/${{ matrix.rid }}" `
            -p:Version="${{ needs.release-metadata.outputs.package_version }}" `
            -p:FileVersion="${{ needs.release-metadata.outputs.file_version }}" `
            -p:InaraApplicationApiKey="$env:INARA_APPLICATION_API_KEY" `
            -p:VoxStellarSharedKey="$env:VOXSTELLAR_SHARED_KEY" `
            -p:DebugType=None `
            -p:DebugSymbols=false

      - name: Publish diagnostic replay controller
        shell: pwsh
        run: |
          $controllerOutput = Join-Path $env:RUNNER_TEMP "replay-controller-${{ matrix.rid }}"
          dotnet publish src/SrvSurvey.ReplayController/SrvSurvey.ReplayController.csproj `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained true `
            --output $controllerOutput `
            -p:Version="${{ needs.release-metadata.outputs.package_version }}" `
            -p:FileVersion="${{ needs.release-metadata.outputs.file_version }}" `
            -p:DebugType=None `
            -p:DebugSymbols=false
          Get-ChildItem -LiteralPath $controllerOutput -File `
            -Filter 'SrvSurvey.ReplayController*' |
              Copy-Item -Destination "artifacts/${{ matrix.rid }}" -Force
          $controllerEntryPoint = if ('${{ matrix.rid }}' -eq 'win-x64') {
            'SrvSurvey.ReplayController.exe'
          } else {
            'SrvSurvey.ReplayController'
          }
          $publishedController = Join-Path "artifacts/${{ matrix.rid }}" $controllerEntryPoint
          if (-not (Test-Path -LiteralPath $publishedController -PathType Leaf)) {
            throw "The replay controller entry point was not published."
          }

      - name: Remove optional Linux LTTng tracing provider
        if: matrix.rid == 'linux-x64'
        shell: pwsh
        run: |
          $provider = "artifacts/${{ matrix.rid }}/libcoreclrtraceptprovider.so"
          if (Test-Path -LiteralPath $provider -PathType Leaf) {
            # This optional CoreCLR diagnostics provider requires the obsolete
            # liblttng-ust.so.0 ABI; SrvSurvey does not use LTTng tracing.
            Remove-Item -LiteralPath $provider -Force
          } else {
            Write-Host "The SDK did not publish the optional LTTng provider."
          }

      - name: Generate package manifest
        shell: pwsh
        run: >-
          ./scripts/New-CrossPlatformPackageManifest.ps1
          -PublishDirectory "artifacts/${{ matrix.rid }}"
          -Version "${{ needs.release-metadata.outputs.package_version }}"
          -RuntimeIdentifier "${{ matrix.rid }}"

      - name: Prepare package output
        shell: pwsh
        run: New-Item -ItemType Directory -Path packages -Force | Out-Null

      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: artifacts/${{ matrix.rid }}
          format: spdx-json
          output-file: packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-${{ matrix.rid }}.spdx.json
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Package Windows application
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath $archive

      - name: Package Linux application
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar --create --gzip \
            --file "packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-${{ matrix.rid }}.tar.gz" \
            --directory "artifacts/${{ matrix.rid }}" .

      - name: Cache pinned AppImage tools
        if: matrix.archive == 'tar.gz'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/appimage-tools
          key: ${{ runner.os }}-${{ runner.arch }}-appimage-tools-v1-${{ hashFiles('scripts/Get-AppImageTools.sh') }}

      - name: Validate Linux desktop metadata
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          desktop-file-validate packaging/linux/io.github.fenris159.SrvSurvey.desktop
          appstreamcli validate --no-net packaging/linux/io.github.fenris159.SrvSurvey.metainfo.xml

      - name: Build Linux AppImage
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools" artifacts/appimage
          bash ./scripts/Get-AppImageTools.sh "$RUNNER_TEMP/appimage-tools"
          linuxdeploy="$RUNNER_TEMP/appimage-tools/linuxdeploy-x86_64.AppImage"
          tool="$RUNNER_TEMP/appimage-tools/appimagetool-x86_64.AppImage"
          runtime="$RUNNER_TEMP/appimage-tools/runtime-x86_64"
          convert "src/SrvSurvey.Desktop/Assets/logo-remastered-linux-windows-split.png" \
            -background none \
            -resize 256x256 \
            "artifacts/appimage/srvsurvey.png"
          release_owner="${RELEASE_REPOSITORY%%/*}"
          release_name="${RELEASE_REPOSITORY#*/}"
          if [[ "${{ needs.release-metadata.outputs.is_prerelease }}" == "true" ]]; then
            update_information="gh-releases-zsync|$release_owner|$release_name|latest-all|SrvSurvey-XP-*-x86_64.AppImage.zsync"
          else
            update_information="gh-releases-zsync|$release_owner|$release_name|latest|SrvSurvey-XP-*-x86_64.AppImage.zsync"
          fi
          bash ./scripts/New-LinuxAppImage.sh \
            "artifacts/${{ matrix.rid }}" \
            "${{ needs.release-metadata.outputs.package_version }}" \
            "artifacts/appimage/srvsurvey.png" \
            "$linuxdeploy" \
            "$tool" \
            "$runtime" \
            "packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-x86_64.AppImage" \
            "$update_information"

      - name: Inspect Linux AppImage payload
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          appimage=$(realpath "packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-x86_64.AppImage")
          inspect_root="$RUNNER_TEMP/srvsurvey-appimage-inspection"
          mkdir -p "$inspect_root"
          cd "$inspect_root"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/lib/srvsurvey/SrvSurvey.Desktop
          test -x squashfs-root/usr/lib/srvsurvey/SrvSurvey.ReplayController
          test -f squashfs-root/usr/lib/srvsurvey/release-package.json
          test -f squashfs-root/io.github.fenris159.SrvSurvey.desktop
          test -f squashfs-root/srvsurvey.png
          test -f squashfs-root/usr/share/metainfo/io.github.fenris159.SrvSurvey.metainfo.xml
          test -f squashfs-root/usr/share/licenses/srvsurvey/LICENSE
          actual_update_information=$(
            "$appimage" --appimage-updateinformation
          )
          test -n "$actual_update_information"
          test -s "$appimage.zsync"

      - name: Validate AppImage runtime dependencies and XWayland startup
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: >-
          bash ./scripts/Test-LinuxAppImageRuntime.sh
          "packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-x86_64.AppImage"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SrvSurvey-package-${{ matrix.rid }}
          path: packages/*
          if-no-files-found: error
          retention-days: 14
          # Packages are already compressed; avoid recompressing them for transport.
          compression-level: 0

  validate-linux-ubuntu-26:
    name: Validate Linux x64 on Ubuntu 26.04
    needs:
      - release-metadata
      - build-test-publish
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: SrvSurvey-package-linux-x64
          path: packages

      - name: Set up Linux runtime validation dependencies
        uses: ./.github/actions/setup-linux-release
        with:
          profile: runtime

      - name: Validate AppImage dependency closure and XWayland startup
        shell: bash
        run: |
          appimage="packages/SrvSurvey-XP-${{ needs.release-metadata.outputs.package_version }}-x86_64.AppImage"
          chmod +x "$appimage"
          bash ./scripts/Test-LinuxAppImageRuntime.sh "$appimage"

  publish-release:
    name: Publish GitHub release assets
    if: needs.release-metadata.outputs.is_release == 'true'
    needs:
      - release-metadata
      - build-test-publish
      - validate-linux-ubuntu-26
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: SrvSurvey-package-*
          path: packages
          merge-multiple: true

      - name: Generate release index
        shell: pwsh
        run: |
          ./scripts/New-CrossPlatformReleaseIndex.ps1 `
            -PackageDirectory packages `
            -Version "${{ needs.release-metadata.outputs.package_version }}" `
            -OutputPath packages/release-index.json
          $index = Get-Content packages/release-index.json -Raw | ConvertFrom-Json
          $expectedSchema = [int]'${{ needs.release-metadata.outputs.release_index_schema }}'
          if ($index.schemaVersion -ne $expectedSchema) {
            throw "Release index schema $($index.schemaVersion) does not match resolved schema $expectedSchema."
          }

      - name: Read release notes from packaged source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.release-metadata.outputs.source_sha }}
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          git show "$SOURCE_SHA:CurrentReleaseNotes.md" > "$RUNNER_TEMP/srvsurvey-release-notes.md"

      - name: Create or repair release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ env.RELEASE_REPOSITORY }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.package_version }}
          IS_PRERELEASE: ${{ needs.release-metadata.outputs.is_prerelease }}
          SOURCE_SHA: ${{ needs.release-metadata.outputs.source_sha }}
        run: |
          set -euo pipefail

          release_args=(
            --notes-file "$RUNNER_TEMP/srvsurvey-release-notes.md"
            --title "SrvSurvey-XP $RELEASE_VERSION"
            --latest=false
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          # Create the release shell first as a draft (no assets). Uploading large
          # packages in the same `gh release create` call has no retries and fails on
          # transient GitHub HTTP 500 "Error saving asset" responses. Per-file upload
          # below can retry and is also the repair path when a previous attempt left a
          # release behind. Publish only after every asset upload succeeds.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists for $RELEASE_TAG."
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag exists but release doesn't. Creating draft release from tag..."
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              "${release_args[@]}"
          else
            echo "Creating new draft release and tag..."
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$SOURCE_SHA" \
              "${release_args[@]}"
          fi

          echo "Uploading and updating assets..."
          for file in packages/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "Uploading: $filename"
              max_attempts=5
              attempt=1
              while [ "$attempt" -le "$max_attempts" ]; do
                if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                  echo "Successfully uploaded: $filename"
                  break
                fi
                if [ "$attempt" -lt "$max_attempts" ]; then
                  sleep_seconds=$((attempt * 10))
                  echo "Upload attempt $attempt failed. Retrying in ${sleep_seconds}s..."
                  sleep "$sleep_seconds"
                  attempt=$((attempt + 1))
                else
                  echo "Failed to upload $filename after $max_attempts attempts"
                  exit 1
                fi
              done
            fi
          done

          echo "Updating release metadata and publishing..."
          publish_latest=false
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            publish_latest=true
          fi
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --notes-file "$RUNNER_TEMP/srvsurvey-release-notes.md" \
            --title "SrvSurvey-XP $RELEASE_VERSION" \
            --prerelease="$IS_PRERELEASE" \
            --latest="$publish_latest"

          echo "Release successfully published!"
