name: Publish Windows and Linux release

run-name: Publish SrvSurvey ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 2.0.95 or 2.0.95.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Build, test, and publish release
    uses: ./.github/workflows/avalonia-build.yml
    with:
      version: ${{ inputs.version }}
      publish_release: true
