name: Cache NuGet dependencies
description: Reuse downloaded packages while still restoring project assets on each runner
runs:
  using: composite
  steps:
    - name: Cache NuGet packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.Config', '**/NuGet.config', 'global.json', '**/dotnet-tools.json') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-
